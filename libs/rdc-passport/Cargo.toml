[package]
name = "rdc-passport"
version = "0.1.0"
edition = "2021"
description = "Device passports: an issuing-key certificate signed by the CA root, and a passport signed by the issuing key"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
